<!DOCTYPE html>
<html>
<head>
  <title>VayuDrishti</title>
  <style>
    body {
      margin: 0;
      background: rgb(1, 1, 16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      width: 550px;
      animation: zoomFade 2.5s ease-in-out;
    }
    h1{
      font-family: 'Montserrat', sans-serif;
      color: white;
      
    }
    @keyframes zoomFade {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

<img src="{{ url_for('static', filename='assests/logo2.png') }}" alt="VayuDrishti Logo">

<script>
  setTimeout(() => {
    window.location.href = "/home";
  }, 2500);
</script>

</body>
</html>
